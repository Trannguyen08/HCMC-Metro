services:
  db:
    image: postgres:16-alpine
    container_name: project_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - project-network

  redis:
    image: redis:7-alpine
    container_name: project_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - project-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: project_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit vm_memory_high_watermark 0.4
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - project-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: project_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - project-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_backend
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-postgres}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - rabbitmq
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - project-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: project_frontend
    env_file:
      - .env
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - project-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_celery_worker
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-postgres}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - ./backend:/app
    networks:
      - project-network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_celery_beat
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-postgres}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - ./backend:/app
    networks:
      - project-network

networks:
  project-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
